name: Build iOS IPA (LsmVoice)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Package
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Root & Client Dependencies
        run: |
          npm install --include=dev
          cd client && npm install --include=dev

      - name: Build Web Client & Sync Capacitor
        run: |
          cd client
          npm run build
          npx cap sync ios

      - name: Build iOS Archive with Xcode
        run: |
          cd client/ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into IPA
        run: |
          cd client/ios/App/build/App.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r ../../../../LsmVoice.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LsmVoice-iOS-IPA
          path: client/ios/LsmVoice.ipa
          retention-days: 14
