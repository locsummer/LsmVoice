name: Build iOS IPA (LsmVoice)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Package
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          echo "=== Scanning Available Xcode Installations ==="
          ls -d /Applications/Xcode* || true
          FOUND_XCODE=""
          for ver in 16.2 16.1 16.0 16; do
            if [ -d "/Applications/Xcode_${ver}.app" ]; then
              FOUND_XCODE="/Applications/Xcode_${ver}.app"
              break
            fi
          done
          if [ -n "$FOUND_XCODE" ]; then
            echo "Selecting $FOUND_XCODE"
            sudo xcode-select -s "$FOUND_XCODE"
            echo "DEVELOPER_DIR=$FOUND_XCODE" >> $GITHUB_ENV
          else
            echo "Using default xcode-select"
          fi
          xcodebuild -version

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Build Web Client (Vite)
        run: |
          cd client
          npm run build

      - name: Sync iOS Native Shell (Capacitor)
        run: |
          cd client
          npx @capacitor/cli sync ios

      - name: Verify Schemes & Config
        run: |
          cd client/ios/App
          xcodebuild -project App.xcodeproj -list

      - name: Resolve Swift Package Dependencies
        run: |
          cd client/ios/App
          xcodebuild -project App.xcodeproj -scheme App -derivedDataPath derived_data -resolvePackageDependencies

      - name: Compile iOS App (Unsigned for Sideloading)
        run: |
          cd client/ios/App
          set +e
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data \
            -xcconfig build.xcconfig \
            OTHER_SWIFT_FLAGS='$(inherited) -enable-experimental-feature NonescapableTypes' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE="Manual" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build > xcode_build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::error::Xcode build failed with exit code $STATUS"
            echo "==================== XCODE BUILD ERROR LOG ===================="
            grep -i -E "error:|failed" xcode_build.log | head -n 50 || true
            tail -n 80 xcode_build.log
            echo "==============================================================="
            exit $STATUS
          fi

      - name: Upload Xcode Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-Build-Log
          path: client/ios/App/xcode_build.log

      - name: Package Payload into IPA
        run: |
          cd client/ios/App
          APP_PATH=$(find derived_data/Build/Products -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find App.app in derived_data!"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -q ../../../LsmVoice.ipa Payload
          cd ../../..
          ls -lh LsmVoice.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LsmVoice-iOS-IPA
          path: LsmVoice.ipa
          retention-days: 14
