name: Build iOS IPA (LsmVoice)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Package
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Build Web Client (Vite)
        run: |
          cd client
          npm run build

      - name: Sync iOS Native Shell (Capacitor)
        run: |
          cd client
          npx @capacitor/cli sync ios

      - name: Verify Xcode Version
        run: |
          xcodebuild -version

      - name: Compile iOS App (Unsigned for Sideloading)
        run: |
          cd client/ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Payload into IPA
        run: |
          cd client/ios/App
          mkdir -p Payload
          cp -r derived_data/Build/Products/Release-iphoneos/App.app Payload/
          zip -r -q ../../../LsmVoice.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LsmVoice-iOS-IPA
          path: LsmVoice.ipa
          retention-days: 14
